<text x="702" y="344" font-size="17" font-weight="650">暂停，等待处理</text><text x="702" y="368" font-size="13">基线变动或修改冲突</text>
<rect class="s" x="32" y="422" width="15" height="15" rx="4"/><text x="56" y="435" font-size="14">记录与结果</text><rect class="g" x="314" y="422" width="15" height="15" rx="4"/><text x="338" y="435" font-size="14">资源与处理</text><rect class="o" x="596" y="422" width="15" height="15" rx="4"/><text x="620" y="435" font-size="14">核验与控制</text>
