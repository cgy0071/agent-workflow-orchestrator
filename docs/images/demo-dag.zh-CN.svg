<svg xmlns="http://www.w3.org/2000/svg" width="780" height="262" viewBox="0 0 780 262" role="img"><title>演示任务图</title><style>
.bg{fill:#ffffff;stroke:#d0d7de}.box{fill:#f6f8fa;stroke:#d0d7de}.t{fill:#1f2328}.m{fill:#59636e}
.ar{stroke:#59636e;fill:none;stroke-width:1.6}.ah{fill:#59636e}.dash{stroke-dasharray:5 4}
.agent{fill:#ddf4ff;stroke:#54aeff}.tool{fill:#dafbe1;stroke:#4ac26b}.warn{fill:#fff8c5;stroke:#d4a72c}
.bad{fill:#ffebe9;stroke:#ff8182}.chip{fill:#ffffff;stroke:#d0d7de}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#3d444d}.box{fill:#161b22;stroke:#3d444d}.t{fill:#f0f6fc}.m{fill:#9198a1}
.ar{stroke:#9198a1}.ah{fill:#9198a1}.agent{fill:#0c2d6b;stroke:#1f6feb}.tool{fill:#0f2d1a;stroke:#2ea043}
.warn{fill:#341a00;stroke:#9e6a03}.bad{fill:#3c0f13;stroke:#da3633}.chip{fill:#0d1117;stroke:#3d444d}}
text{font-family:-apple-system,"Segoe UI","Noto Sans","Helvetica Neue",Arial,"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect x="0.5" y="0.5" width="779" height="261" rx="10" class="bg"/><text x="150" y="34" font-size="12.5" text-anchor="middle" class="m">第 1 轮：A 与 B 同时派发</text><text x="620" y="34" font-size="12.5" text-anchor="middle" class="m">第 2 轮：JOIN 才可派发</text><rect x="60" y="50" width="180" height="70" rx="8" class="agent"/><text x="150" y="81.5" font-size="15" text-anchor="middle" font-weight="600" class="t">A</text><text x="150" y="101.5" font-size="12.5" text-anchor="middle" class="m">Worker：executor</text><rect x="60" y="160" width="180" height="70" rx="8" class="agent"/><text x="150" y="191.5" font-size="15" text-anchor="middle" font-weight="600" class="t">B</text><text x="150" y="211.5" font-size="12.5" text-anchor="middle" class="m">Worker：second</text><rect x="530" y="95" width="190" height="90" rx="8" class="agent"/><text x="625" y="128" font-size="15" text-anchor="middle" font-weight="600" class="t">JOIN</text><text x="625" y="148" font-size="12.5" text-anchor="middle" class="m">Worker：executor</text><text x="625" y="165" font-size="12.5" text-anchor="middle" class="m">依赖 A 和 B</text><path d="M240,85 L380,85 L380,125 L528,125" class="ar" marker-end="url(#ah)"/><path d="M240,195 L380,195 L380,155 L528,155" class="ar" marker-end="url(#ah)"/><rect x="275" y="128" width="210" height="24" rx="12" class="warn"/><text x="380" y="145" font-size="11.5" text-anchor="middle" class="t">仅当两份审核均为 accept</text><rect x="110" y="126" width="80" height="20" rx="10" class="tool"/><text x="150" y="138" font-size="11.5" text-anchor="middle" class="t mono">accepted</text><rect x="110" y="236" width="80" height="20" rx="10" class="tool"/><text x="150" y="248" font-size="11.5" text-anchor="middle" class="t mono">accepted</text><rect x="585" y="196" width="80" height="20" rx="10" class="tool"/><text x="625" y="208" font-size="11.5" text-anchor="middle" class="t mono">accepted</text></svg>
