<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="393" viewBox="0 0 1000 393" role="img"><title>Offline demo output</title><style>
.bg{fill:#ffffff;stroke:#d0d7de}.box{fill:#f6f8fa;stroke:#d0d7de}.t{fill:#1f2328}.m{fill:#59636e}
