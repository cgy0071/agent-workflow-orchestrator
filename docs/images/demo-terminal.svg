_or_advance | unavailable</text><text x="18" y="223" font-size="12.5" class="mono" fill="#9198a1" xml:space="preserve">  dag: demo/B needs: none</text><text x="18" y="242" font-size="12.5" class="mono" fill="#9198a1" xml:space="preserve">  dispatch: running; claim: none; reviews: accept</text><text x="18" y="261" font-size="12.5" class="mono" fill="#9198a1" xml:space="preserve">  warnings: no_monitor_observation</text><text x="18" y="280" font-size="12.5" class="mono" fill="#7ee787" xml:space="preserve">JOIN | accepted | python-child/command/executor | planner/release_claim_or_advance | unavailable</text><text x="18" y="299" font-size="12.5" class="mono" fill="#9198a1" xml:space="preserve">  dag: demo/JOIN needs: A, B</text><text x="18" y="318" font-size="12.5" class="mono" fill="#9198a1" xml:space="preserve">  dispatch: running; claim: none; reviews: accept</text><text x="18" y="337" font-size="12.5" class="mono" fill="#9198a1" xml:space="preserve">  warnings: no_monitor_observation</text><text x="18" y="356" font-size="12.5" class="mono" fill="#e6edf3" xml:space="preserve">Worker heartbeat: unavailable. Observation age does not establish worker failure.</text></svg>
