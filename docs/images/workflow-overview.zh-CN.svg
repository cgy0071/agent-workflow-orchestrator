"middle" font-weight="600" class="t">Reviewer 审核者</text><text x="145" y="243" font-size="12.5" text-anchor="middle" class="m">阅读原始证据</text><text x="145" y="260" font-size="12.5" text-anchor="middle" class="m">accept / repair / reject</text><path d="M200,85 L258,85" class="ar" marker-end="url(#ah)"/><path d="M520,85 L598,85" class="ar" marker-end="url(#ah)"/><text x="560" y="75" font-size="11.5" text-anchor="middle" class="m">只发送一次</text><path d="M745,130 L745,188" class="ar" marker-end="url(#ah)"/><path d="M600,235 L542,235" class="ar" marker-end="url(#ah)"/><path d="M320,235 L262,235" class="ar" marker-end="url(#ah)"/><path d="M200,190 L200,160 L390,160 L390,132" class="ar dash" marker-end="url(#ah)"/><text x="295" y="153" font-size="11.5" text-anchor="middle" class="m">下一任务或返工任务</text><rect x="30" y="303" width="14" height="14" rx="3" class="agent"/><text x="52" y="314" font-size="12.5" text-anchor="start" class="m">AI Agent（任意客户端）</text><rect x="250" y="303" width="14" height="14" rx="3" class="tool"/><text x="272" y="314" font-size="12.5" text-anchor="start" class="m">本仓库中的脚本</text></svg>
