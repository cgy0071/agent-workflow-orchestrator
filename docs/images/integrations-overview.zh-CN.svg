<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">可选工具接在哪里？</title><desc id="desc">知识授权、客户端、状态面板与收件箱围绕执行流程工作。</desc>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}.t{fill:#1f2328}.m{fill:#59636e}
.ar{stroke:#59636e;fill:none;stroke-width:1.6}.ah{fill:#59636e}.dash{stroke-dasharray:5 4}


@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#3d444d}.t{fill:#f0f6fc}.m{fill:#9198a1}
.ar{stroke:#9198a1}.ah{fill:#9198a1}
}
text{font-family:-apple-system,"Segoe UI","Noto Sans","Helvetica Neue",Arial,"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}
.agent{fill:#ddf4ff;stroke:#54aeff}
.ledger{fill:#eaf0fc;stroke:#7482aa}
.knowledge{fill:#fbefff;stroke:#a475ce}
.adapter{fill:#dafbe1;stroke:#4ac26b}
.dashboard{fill:#ddf8f7;stroke:#32958f}
.inbox{fill:#fff1e5;stroke:#c56b29}
@media (prefers-color-scheme: dark){
.agent{fill:#0c2d6b;stroke:#1f6feb}
.ledger{fill:#252b42;stroke:#a4add0}
.knowledge{fill:#2c183e;stroke:#b083db}
.adapter{fill:#0f2d1a;stroke:#2ea043}
.dashboard{fill:#063637;stroke:#45b8ae}
.inbox{fill:#402411;stroke:#e79350}
}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect x=".5" y=".5" width="959" height="509" rx="12" class="bg"/>
<text x="32" y="42" font-size="25" class="t" text-anchor="start" font-weight="600">可选工具接在哪里？</text>
<text x="32" y="68" font-size="15" class="m" text-anchor="start">知识授权、客户端、状态面板与收件箱围绕执行流程工作。</text>
<rect x="30" y="110" width="195" height="80" rx="9" class="knowledge"/>
<text x="46" y="136" font-size="17" class="t" text-anchor="start" font-weight="600">知识库</text>
<text x="46" y="159" font-size="14" class="m" text-anchor="start">只读获准文档</text>
<text x="46" y="177" font-size="14" class="m" text-anchor="start">撤权后拒绝再次读取</text>
<rect x="265" y="110" width="195" height="80" rx="9" class="adapter"/>
<text x="281" y="136" font-size="17" class="t" text-anchor="start" font-weight="600">客户端适配器</text>
<text x="281" y="159" font-size="14" class="m" text-anchor="start">调用受支持的客户端</text>
<text x="281" y="177" font-size="14" class="m" text-anchor="start">可用于执行或审核</text>
<rect x="500" y="110" width="195" height="80" rx="9" class="dashboard"/>
<text x="516" y="136" font-size="17" class="t" text-anchor="start" font-weight="600">状态面板</text>
<text x="516" y="159" font-size="14" class="m" text-anchor="start">从任务记录读取进度</text>
<text x="516" y="177" font-size="14" class="m" text-anchor="start">不改变审核结论</text>
<rect x="735" y="110" width="195" height="80" rx="9" class="inbox"/>
<text x="751" y="136" font-size="17" class="t" text-anchor="start" font-weight="600">收件箱与外部通知</text>
<text x="751" y="159" font-size="14" class="m" text-anchor="start">交付待审时提醒审核者</text>
<text x="751" y="177" font-size="14" class="m" text-anchor="start">通知本身不算验收</text>
<rect x="30" y="279" width="195" height="80" rx="9" class="agent"/>
<text x="46" y="305" font-size="17" class="t" text-anchor="start" font-weight="600">Planner</text>
<text x="46" y="328" font-size="14" class="m" text-anchor="start">准备任务与授权材料</text>
<path d="M225 318 H263" class="ar" marker-end="url(#ah)"/>
<rect x="265" y="279" width="195" height="80" rx="9" class="agent"/>
<text x="281" y="305" font-size="17" class="t" text-anchor="start" font-weight="600">Executor</text>
<text x="281" y="328" font-size="14" class="m" text-anchor="start">完成工作，交付证据</text>
<path d="M460 318 H498" class="ar" marker-end="url(#ah)"/>
<rect x="500" y="279" width="195" height="80" rx="9" class="ledger"/>
<text x="516" y="305" font-size="17" class="t" text-anchor="start" font-weight="600">任务记录</text>
<text x="516" y="328" font-size="14" class="m" text-anchor="start">监控交付，记录状态</text>
<path d="M695 318 H733" class="ar" marker-end="url(#ah)"/>
<rect x="735" y="279" width="195" height="80" rx="9" class="agent"/>
<text x="751" y="305" font-size="17" class="t" text-anchor="start" font-weight="600">Reviewer</text>
<text x="751" y="328" font-size="14" class="m" text-anchor="start">核对证据并给出结论</text>
<path d="M128 190 V277" class="ar dash" marker-end="url(#ah)"/>
<path d="M362 190 V277" class="ar dash" marker-end="url(#ah)"/>
<path d="M598 279 V192" class="ar dash" marker-end="url(#ah)"/>
<path d="M640 279 V232 H790 V192" class="ar dash" marker-end="url(#ah)"/>
<path d="M865 190 V277" class="ar dash" marker-end="url(#ah)"/>
<text x="32" y="397" font-size="15" class="m" text-anchor="start">实线：任务交接     ·     虚线：可选的资料、工具、查询或提醒</text>
<g id="legend">
<path d="M32 425 H928" class="ar" opacity=".35"/>
<text x="32" y="455" class="t" font-size="15" font-weight="600">颜色图例</text>
<rect x="148" y="442" width="17" height="17" rx="4" class="agent"/>
<text x="173" y="456" class="t" font-size="14">AI 角色</text>
<rect x="398" y="442" width="17" height="17" rx="4" class="ledger"/>
<text x="423" y="456" class="t" font-size="14">任务记录</text>
<rect x="648" y="442" width="17" height="17" rx="4" class="knowledge"/>
<text x="673" y="456" class="t" font-size="14">知识来源</text>
<rect x="148" y="474" width="17" height="17" rx="4" class="adapter"/>
<text x="173" y="488" class="t" font-size="14">客户端适配</text>
<rect x="398" y="474" width="17" height="17" rx="4" class="dashboard"/>
<text x="423" y="488" class="t" font-size="14">状态视图</text>
<rect x="648" y="474" width="17" height="17" rx="4" class="inbox"/>
<text x="673" y="488" class="t" font-size="14">通知通道</text>
</g>
</svg>
