<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc" lang="en"><title id="title">Where optional tools connect</title><desc id="desc">Document grants, client adapters, dashboards and inboxes support the execution workflow.</desc>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}.box{fill:#f6f8fa;stroke:#d0d7de}.t{fill:#1f2328}.m{fill:#59636e}
.ar{stroke:#59636e;fill:none;stroke-width:1.6}.ah{fill:#59636e}.dash{stroke-dasharray:5 4}
.agent{fill:#ddf4ff;stroke:#54aeff}.tool{fill:#dafbe1;stroke:#4ac26b}.warn{fill:#fff8c5;stroke:#d4a72c}
.bad{fill:#ffebe9;stroke:#ff8182}.chip{fill:#ffffff;stroke:#d0d7de}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#3d444d}.box{fill:#161b22;stroke:#3d444d}.t{fill:#f0f6fc}.m{fill:#9198a1}
.ar{stroke:#9198a1}.ah{fill:#9198a1}.agent{fill:#0c2d6b;stroke:#1f6feb}.tool{fill:#0f2d1a;stroke:#2ea043}
.warn{fill:#341a00;stroke:#9e6a03}.bad{fill:#3c0f13;stroke:#da3633}.chip{fill:#0d1117;stroke:#3d444d}}
text{font-family:-apple-system,"Segoe UI","Noto Sans","Helvetica Neue",Arial,"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect x=".5" y=".5" width="959" height="439" rx="12" class="bg"/>
<text x="32" y="42" font-size="25" class="t" text-anchor="start" font-weight="600">Where optional tools connect</text>
<text x="32" y="68" font-size="15" class="m" text-anchor="start">Document grants, client adapters, dashboards and inboxes support the execution workflow.</text>
<rect x="30" y="110" width="195" height="80" rx="9" class="warn"/>
<text x="46" y="136" font-size="17" class="t" text-anchor="start" font-weight="600">Knowledge base</text>
<text x="46" y="159" font-size="14" class="m" text-anchor="start">Read granted documents.</text>
<text x="46" y="177" font-size="14" class="m" text-anchor="start">Revoke to stop new reads.</text>
<rect x="265" y="110" width="195" height="80" rx="9" class="tool"/>
<text x="281" y="136" font-size="17" class="t" text-anchor="start" font-weight="600">Client adapters</text>
<text x="281" y="159" font-size="14" class="m" text-anchor="start">Connect supported clients</text>
<text x="281" y="177" font-size="14" class="m" text-anchor="start">for execution or review.</text>
<rect x="500" y="110" width="195" height="80" rx="9" class="tool"/>
<text x="516" y="136" font-size="17" class="t" text-anchor="start" font-weight="600">Status dashboard</text>
<text x="516" y="159" font-size="14" class="m" text-anchor="start">Read recorded progress.</text>
<text x="516" y="177" font-size="14" class="m" text-anchor="start">No approval authority.</text>
<rect x="735" y="110" width="195" height="80" rx="9" class="tool"/>
<text x="751" y="136" font-size="17" class="t" text-anchor="start" font-weight="600">Inbox and alerts</text>
<text x="751" y="159" font-size="14" class="m" text-anchor="start">Signal a delivery for review.</text>
<text x="751" y="177" font-size="14" class="m" text-anchor="start">An alert is not acceptance.</text>
<rect x="30" y="279" width="195" height="80" rx="9" class="agent"/>
<text x="46" y="305" font-size="17" class="t" text-anchor="start" font-weight="600">Planner</text>
<text x="46" y="328" font-size="14" class="m" text-anchor="start">Prepare task and context.</text>
<path d="M225 318 H263" class="ar" marker-end="url(#ah)"/>
<rect x="265" y="279" width="195" height="80" rx="9" class="agent"/>
<text x="281" y="305" font-size="17" class="t" text-anchor="start" font-weight="600">Executor</text>
<text x="281" y="328" font-size="14" class="m" text-anchor="start">Deliver work and evidence.</text>
<path d="M460 318 H498" class="ar" marker-end="url(#ah)"/>
<rect x="500" y="279" width="195" height="80" rx="9" class="box"/>
<text x="516" y="305" font-size="17" class="t" text-anchor="start" font-weight="600">Task ledger</text>
<text x="516" y="328" font-size="14" class="m" text-anchor="start">Record delivery and state.</text>
<path d="M695 318 H733" class="ar" marker-end="url(#ah)"/>
<rect x="735" y="279" width="195" height="80" rx="9" class="agent"/>
<text x="751" y="305" font-size="17" class="t" text-anchor="start" font-weight="600">Reviewer</text>
<text x="751" y="328" font-size="14" class="m" text-anchor="start">Check evidence and decide.</text>
<path d="M128 190 V277" class="ar dash" marker-end="url(#ah)"/>
<path d="M362 190 V277" class="ar dash" marker-end="url(#ah)"/>
<path d="M598 279 V192" class="ar dash" marker-end="url(#ah)"/>
<path d="M640 279 V232 H790 V192" class="ar dash" marker-end="url(#ah)"/>
<path d="M865 190 V277" class="ar dash" marker-end="url(#ah)"/>
<text x="32" y="397" font-size="15" class="m" text-anchor="start">Solid: task handoff     /     Dashed: optional data, tools, views or alerts</text>
</svg>
