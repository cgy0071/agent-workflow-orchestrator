<title id="title">Find passages by topic, with sources</title><desc id="desc">Ask a question without a document ID. Extraction alone never grants access. Read-only extraction: Markdown, notes and text PDFs; Filter by current grant: Check project and task scope; Expand the query: Glossary, avoid-list, bilingual terms; Revoked or out of scope: Excluded before ranking; Rank eligible passages: Lexical search; vectors optional; Top matches with citations: Source + text location or PDF page.</desc>
