<svg xmlns="http://www.w3.org/2000/svg" width="1034" height="292" viewBox="0 0 1034 292" role="img"><title>任务生命周期</title><style>
.bg{fill:#ffffff;stroke:#d0d7de}.box{fill:#f6f8fa;stroke:#d0d7de}.t{fill:#1f2328}.m{fill:#59636e}
.ar{stroke:#59636e;fill:none;stroke-width:1.6}.ah{fill:#59636e}.dash{stroke-dasharray:5 4}
.agent{fill:#ddf4ff;stroke:#54aeff}.tool{fill:#dafbe1;stroke:#4ac26b}.warn{fill:#fff8c5;stroke:#d4a72c}
.bad{fill:#ffebe9;stroke:#ff8182}.chip{fill:#ffffff;stroke:#d0d7de}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#3d444d}.box{fill:#161b22;stroke:#3d444d}.t{fill:#f0f6fc}.m{fill:#9198a1}
.ar{stroke:#9198a1}.ah{fill:#9198a1}.agent{fill:#0c2d6b;stroke:#1f6feb}.tool{fill:#0f2d1a;stroke:#2ea043}
.warn{fill:#341a00;stroke:#9e6a03}.bad{fill:#3c0f13;stroke:#da3633}.chip{fill:#0d1117;stroke:#3d444d}}
text{font-family:-apple-system,"Segoe UI","Noto Sans","Helvetica Neue",Arial,"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect x="0.5" y="0.5" width="1033" height="291" rx="10" class="bg"/><rect x="24" y="60" width="170" height="84" rx="8" class="agent"/><text x="109" y="98.5" font-size="13.5" text-anchor="middle" font-weight="600" class="t mono">ready</text><text x="109" y="118.5" font-size="12.5" text-anchor="middle" class="m">依赖已满足</text><path d="M194,102 L226,102" class="ar" marker-end="url(#ah)"/><text x="211" y="52" font-size="11" text-anchor="middle" class="m mono">dispatch</text><rect x="228" y="60" width="170" height="84" rx="8" class="warn"/><text x="313" y="98.5" font-size="13.5" text-anchor="middle" font-weight="600" class="t mono">execution_unconfirmed</text><text x="313" y="118.5" font-size="12.5" text-anchor="middle" class="m">只发送一次，不重发</text><path d="M398,102 L430,102" class="ar" marker-end="url(#ah)"/><text x="415" y="52" font-size="11" text-anchor="middle" class="m mono">reconcile</text><rect x="432" y="60" width="170" height="84" rx="8" class="agent"/><text x="517" y="90" font-size="13.5" text-anchor="middle" font-weight="600" class="t mono">executing</text><text x="517" y="110" font-size="12.5" text-anchor="middle" class="m">reconcile 确认</text><text x="517" y="127" font-size="12.5" text-anchor="middle" class="m">已开始执行</text><path d="M602,102 L634,102" class="ar" marker-end="url(#ah)"/><text x="619" y="52" font-size="11" text-anchor="middle" class="m mono">monitor</text><rect x="636" y="60" width="170" height="84" rx="8" class="agent"/><text x="721" y="90" font-size="13.5" text-anchor="middle" font-weight="600" class="t mono">awaiting_review</text><text x="721" y="110" font-size="12.5" text-anchor="middle" class="m">review_ready：</text><text x="721" y="127" font-size="12.5" text-anchor="middle" class="m">文件与 nonce 有效</text><path d="M806,102 L838,102" class="ar" marker-end="url(#ah)"/><text x="823" y="52" font-size="11" text-anchor="middle" class="m mono">review</text><rect x="840" y="60" width="170" height="84" rx="8" class="tool"/><text x="925" y="90" font-size="13.5" text-anchor="middle" font-weight="600" class="t mono">accepted</text><text x="925" y="110" font-size="12.5" text-anchor="middle" class="m">审核已记录</text><text x="925" y="127" font-size="12.5" text-anchor="middle" class="m">解锁下游任务</text><path d="M517,144 L517,196" class="ar dash" marker-end="url(#ah)"/><rect x="426" y="198" width="182" height="74" rx="8" class="warn"/><text x="517" y="223" font-size="13" text-anchor="middle" font-weight="600" class="t mono">needs_inspection</text><text x="517" y="243" font-size="12.5" text-anchor="middle" class="m">停止、提示或中断：</text><text x="517" y="260" font-size="12.5" text-anchor="middle" class="m">继续观察；继续一次或关闭</text><path d="M721,144 L721,196" class="ar dash" marker-end="url(#ah)"/><rect x="630" y="198" width="182" height="74" rx="8" class="bad"/><text x="721" y="223" font-size="13" text-anchor="middle" font-weight="600" class="t mono">review_blocked</text><text x="721" y="243" font-size="12.5" text-anchor="middle" class="m">reject 或 repair：</text><text x="721" y="260" font-size="12.5" text-anchor="middle" class="m">新建限定范围任务</text><path d="M925,144 L925,196" class="ar dash" marker-end="url(#ah)"/><rect x="834" y="198" width="182" height="74" rx="8" class="bad"/><text x="925" y="223" font-size="13" text-anchor="middle" font-weight="600" class="t mono">evidence_changed</text><text x="925" y="243" font-size="12.5" text-anchor="middle" class="m">已通过的文件被改动：</text><text x="925" y="260" font-size="12.5" text-anchor="middle" class="m">下游保持阻塞</text></svg>
